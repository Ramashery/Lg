<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPSAN — 3D Viewer</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101114;color:#f2f3f5;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
#stage{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
.topbar{position:fixed;top:20px;left:22px;right:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.brand strong{display:block;font-size:19px;letter-spacing:.22em;font-weight:650}
.brand span{display:block;margin-top:5px;color:#9da2ab;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.panel{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
button{border:1px solid #454a54;background:rgba(29,32,38,.86);color:#eef0f4;padding:10px 13px;border-radius:9px;font:500 12px system-ui;cursor:pointer;backdrop-filter:blur(12px)}
button:hover{background:#343943;border-color:#777f8d}
button.active{background:#e7e9ed;color:#15171b;border-color:#e7e9ed}
.hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid #363a43;border-radius:999px;background:rgba(20,22,27,.76);color:#aeb3bd;font-size:11px;white-space:nowrap;backdrop-filter:blur(12px)}
#status{position:fixed;left:22px;bottom:22px;color:#9da2ab;font-size:11px}
@media(max-width:600px){.topbar{top:14px;left:14px;right:14px;flex-direction:column}.panel{justify-content:flex-start}button{padding:9px 10px}.hint{bottom:14px;font-size:10px;max-width:calc(100% - 28px);text-align:center}#status{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="topbar">
  <div class="brand"><strong>TOPSAN</strong><span>Interactive 3D model</span></div>
  <div class="panel">
    <button id="rotate" class="active">Автовращение: вкл.</button>
    <button id="reset">Сбросить вид</button>
    <button id="fullscreen">На весь экран</button>
  </div>
</div>
<div class="hint">Перетаскивайте мышью для вращения · Колесо — масштаб · На телефоне — жесты</div>
<div id="status">Загрузка 3D-модели…</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const stage=document.getElementById('stage'),status=document.getElementById('status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101114);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.01,1000);
camera.position.set(0,.25,6);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x30333b,2));
const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,5,6);scene.add(key);
const fill=new THREE.DirectionalLight(0xb8c9ff,1.8);fill.position.set(-5,1,-4);scene.add(fill);
const rim=new THREE.PointLight(0xffffff,45,20);rim.position.set(0,-3,4);scene.add(rim);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.055;controls.autoRotate=true;controls.autoRotateSpeed=1.1;
controls.minDistance=1.5;controls.maxDistance=14;controls.target.set(0,0,0);

new GLTFLoader().load('./topsan_3d.glb',gltf=>{
  const model=gltf.scene,box=new THREE.Box3().setFromObject(model);
  const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());
  model.position.sub(center);
  const maxDim=Math.max(size.x,size.y,size.z);
  model.scale.setScalar(3.2/maxDim);
  scene.add(model);
  camera.position.set(0,size.y/maxDim*.35,5.8);
  controls.target.set(0,0,0);controls.update();
  status.textContent='Модель загружена · 360°';
},undefined,error=>{
  console.error(error);
  status.textContent='Не удалось загрузить topsan_3d.glb';
});
document.getElementById('rotate').addEventListener('click',e=>{
  controls.autoRotate=!controls.autoRotate;
  e.currentTarget.classList.toggle('active',controls.autoRotate);
  e.currentTarget.textContent=controls.autoRotate?'Автовращение: вкл.':'Автовращение: выкл.';
});
document.getElementById('reset').addEventListener('click',()=>{
  camera.position.set(0,.25,6);controls.target.set(0,0,0);controls.update();
});
document.getElementById('fullscreen').addEventListener('click',async()=>{
  if(!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
  else await document.exitFullscreen?.();
});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
</script>
</body>
</html>
